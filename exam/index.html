document.getElementById('tot').textContent=Q.length;
function answered(i){var el=f.querySelectorAll('input[name="q'+i+'"]:checked');return el.length>0;}
function upd(){var n=0;for(var i=0;i<Q.length;i++)if(answered(i))n++;document.getElementById('cnt').textContent=n;document.getElementById('fill').style.width=(n/Q.length*100)+'%';}
f.addEventListener('change',upd);
function tx(i){var q=Q[i],r=[];f.querySelectorAll('input[name="q'+i+'"]:checked').forEach(function(c){
 if(c.value==='other'){r.push('වෙනත්: '+(document.getElementById('o'+i).value||'').trim());}
 else{var s=q.o[+c.value];if(q.extra&&c.value==='1'){var e=(document.getElementById('e'+i).value||'').trim();if(e)s+=' ('+e+' වාර)';}r.push(s);}});return r;}
document.getElementById('go').onclick=function(){
 var miss=[];for(var i=0;i<Q.length;i++)if(!answered(i))miss.push(i+1);
 var w=document.getElementById('warn');
 if(miss.length){w.textContent='පිළිතුරු නොදුන් ප්‍රශ්න: '+miss.join(', ');var t=document.getElementById('q'+(miss[0]-1));t.scrollIntoView({behavior:'smooth',block:'center'});return;}
 w.textContent='';
 var s='විභාග වෙබ් අඩවිය – පිළිතුරු\n\n';
 for(var i=0;i<Q.length;i++){s+=(i+1)+'. '+Q[i].t+'\n   → '+tx(i).join(' | ')+'\n\n';}
 var m=(document.getElementById('more').value||'').trim();if(m)s+=(Q.length+1)+'. අමතර සටහන්: '+m+'\n';
 s=s.trim();var who=(document.getElementById('who').value||'').trim();if(who)s='නම: '+who+'\n\n'+s;
 document.getElementById('txt').textContent=s;
 var o=document.getElementById('out');var sent=document.getElementById('sent');var btn=document.getElementById('go');
 function show(msg){sent.textContent=msg;o.style.display='block';o.scrollIntoView({behavior:'smooth',block:'start'});}
 if(ACCESS_KEY.indexOf('YOUR_')===0){show('පිළිතුරු යැවීම තවම සකසා නැහැ. පහත පිටපත් කරන්න ඔබා, WhatsApp වලින් එවන්න.');return;}
 btn.disabled=true;btn.textContent='යවමින්...';
 fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({access_key:ACCESS_KEY,subject:'විභාග වෙබ් අඩවිය – ප්‍රශ්නාවලියේ පිළිතුරු',from_name:who||'Questionnaire',message:s})})
 .then(function(r){return r.json();}).then(function(d){btn.disabled=false;btn.textContent='ඉදිරිපත් කරන්න';
  if(d&&d.success){show('ඔබේ පිළිතුරු යැවුවා. ස්තූතියි!');}else{show('යවන්න බැරි වුණා. පහත පිටපත් කරන්න ඔබා, WhatsApp වලින් එවන්න.');}})
 .catch(function(){btn.disabled=false;btn.textContent='ඉදිරිපත් කරන්න';show('යවන්න බැරි වුණා. පහත පිටපත් කරන්න ඔබා, WhatsApp වලින් එවන්න.');});
};
document.getElementById('back').onclick=function(){document.getElementById('out').style.display='none';window.scrollTo({top:0,behavior:'smooth'});};
document.getElementById('copy').onclick=function(){
 var t=document.getElementById('txt').textContent,m=document.getElementById('cmsg');
 function sel(){var r=document.createRange();r.selectNodeContents(document.getElementById('txt'));var s=window.getSelection();s.removeAllRanges();s.addRange(r);m.textContent='පිටපත් කරන්න බැරි වුණා. තෝරාගත් අකුරු අතින් copy කරන්න.';}
 try{navigator.clipboard.writeText(t).then(function(){m.style.color='var(--acc)';m.textContent='පිටපත් කළා. දැන් WhatsApp එකේ paste කරන්න.';},sel);}catch(e){sel();}
};
</script></body></html>
